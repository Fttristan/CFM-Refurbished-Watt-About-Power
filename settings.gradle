pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'cfm_wap'

include 'common'
include 'forge'

if(!Boolean.getBoolean('forgeOnly')) {
    include 'fabric'
}
